<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Customer Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { padding: 30px; background-color: #f8f9fa; }
    h2 { color: #0d6efd; display: inline-block; margin-right: 20px; }
    .section { margin-bottom: 30px; }
    #logoutBtn {
      float: right;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h2>👥 Customer Management Portal</h2>
  <button id="logoutBtn" class="btn btn-danger btn-sm">Logout</button>

  <!-- Get All Customers -->
  <div class="section">
    <button class="btn btn-primary" onclick="getAllCustomers()">Get All Customers</button>
    <table class="table table-bordered table-striped mt-3" id="customersTable" style="display: none;">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Address</th>
          <th>Mobile</th>
          <th>Units</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Get Customer by ID -->
  <div class="section">
    <h5>🔍 Get Customer by ID</h5>
    <div class="input-group mb-2 w-50">
      <input type="number" class="form-control" id="getId" placeholder="Enter customer ID">
      <button class="btn btn-info" onclick="getCustomerById()">Get</button>
    </div>
    <div id="customerCard" class="card w-75" style="display:none;">
      <div class="card-body">
        <h5 class="card-title" id="customerName"></h5>
        <p class="card-text"><strong>ID:</strong> <span id="customerId"></span></p>
        <p class="card-text"><strong>Email:</strong> <span id="customerEmail"></span></p>
        <p class="card-text"><strong>Address:</strong> <span id="customerAddress"></span></p>
        <p class="card-text"><strong>Mobile:</strong> <span id="customerMobile"></span></p>
        <p class="card-text"><strong>Units:</strong> <span id="customerUnits"></span></p>
      </div>
    </div>
    <div id="customerError" class="text-danger mt-2"></div>
  </div>

  <!-- Create Customer -->
  <div class="section">
    <h5>➕ Create Customer</h5>
    <div class="row g-2 w-75">
      <div class="col-md-2"><input type="text" class="form-control" id="createName" placeholder="Name"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="createEmail" placeholder="Email"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="createAddress" placeholder="Address"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="createMobile" placeholder="Mobile"></div>
      <div class="col-md-2"><input type="number" class="form-control" id="createUnits" placeholder="Units"></div>
      <div class="col-md-2"><button class="btn btn-success w-100" onclick="createCustomer()">Create</button></div>
    </div>
    <div id="createOutput" class="mt-2 text-success fw-bold"></div>
  </div>

  <!-- Update Customer -->
  <div class="section">
    <h5>✏️ Update Customer</h5>
    <div class="row g-2 w-75">
      <div class="col-md-2"><input type="number" class="form-control" id="updateId" placeholder="ID"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="updateName" placeholder="Name"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="updateEmail" placeholder="Email"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="updateAddress" placeholder="Address"></div>
      <div class="col-md-2"><input type="text" class="form-control" id="updateMobile" placeholder="Mobile"></div>
      <div class="col-md-2"><input type="number" class="form-control" id="updateUnits" placeholder="Units"></div>
      <div class="col-md-12 mt-2">
        <button class="btn btn-warning" onclick="updateCustomer()">Update</button>
      </div>
    </div>
    <div id="updateOutput" class="mt-2 text-warning fw-bold"></div>
  </div>

  <!-- Delete Customer -->
  <div class="section">
    <h5>❌ Delete Customer</h5>
    <div class="input-group mb-2 w-50">
      <input type="number" class="form-control" id="deleteId" placeholder="Enter ID to delete">
      <button class="btn btn-danger" onclick="deleteCustomer()">Delete</button>
    </div>
    <div id="deleteOutput" class="mt-2 text-danger fw-bold"></div>
  </div>
</div>

<script>
  const baseUrl = 'http://localhost:8080/pahanaedu-service/customers';

  // Redirect if no token on page load
  window.onload = () => {
    const token = localStorage.getItem("token");
    if (!token) {
      window.location.href = "login.html";
      return;
    }
    // Optionally load customers automatically
    getAllCustomers();
  };

  // Logout button clears token and redirects
  document.getElementById("logoutBtn").addEventListener("click", () => {
    localStorage.removeItem("token");
    window.location.href = "login.html";
  });

  function handleUnauthorized() {
    alert("Session expired or unauthorized. Please login again.");
    localStorage.removeItem("token");
    window.location.href = "login.html";
  }

  async function getAllCustomers() {
    try {
      const res = await fetch(baseUrl, {
        headers: { Authorization: "Bearer " + localStorage.getItem("token") }
      });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (!res.ok) throw new Error("Failed to fetch customers");

      const data = await res.json();

      const table = document.getElementById("customersTable");
      const tbody = table.querySelector("tbody");
      tbody.innerHTML = '';
      data.forEach(c => {
        const row = `<tr>
          <td>${c.id}</td><td>${c.name}</td><td>${c.email}</td><td>${c.address}</td><td>${c.mobile}</td><td>${c.unit_consumed}</td>
        </tr>`;
        tbody.insertAdjacentHTML("beforeend", row);
      });
      table.style.display = data.length ? "table" : "none";

    } catch (err) {
      console.error("Error fetching customers:", err);
    }
  }

  async function getCustomerById() {
    try {
      const id = document.getElementById("getId").value;
      const res = await fetch(`${baseUrl}/${id}`, {
        headers: { Authorization: "Bearer " + localStorage.getItem("token") }
      });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (!res.ok) throw new Error("Customer not found");

      const c = await res.json();
      document.getElementById("customerCard").style.display = "block";
      document.getElementById("customerId").textContent = c.id;
      document.getElementById("customerName").textContent = c.name;
      document.getElementById("customerEmail").textContent = c.email;
      document.getElementById("customerAddress").textContent = c.address;
      document.getElementById("customerMobile").textContent = c.mobile;
      document.getElementById("customerUnits").textContent = c.unit_consumed;
      document.getElementById("customerError").textContent = "";

    } catch (err) {
      document.getElementById("customerCard").style.display = "none";
      document.getElementById("customerError").textContent = err.message;
    }
  }

  async function createCustomer() {
    try {
      const body = {
        name: document.getElementById("createName").value,
        email: document.getElementById("createEmail").value,
        address: document.getElementById("createAddress").value,
        mobile: document.getElementById("createMobile").value,
        unit_consumed: parseInt(document.getElementById("createUnits").value)
      };

      const res = await fetch(baseUrl, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + localStorage.getItem("token")
        },
        body: JSON.stringify(body)
      });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (!res.ok) throw new Error("Failed to create customer");

      const data = await res.json();

      document.getElementById("createOutput").textContent =
        `✅ Customer "${data.name}" created with ID ${data.id}`;
      getAllCustomers();

    } catch (err) {
      console.error("Create error:", err);
      document.getElementById("createOutput").textContent = "❌ " + err.message;
    }
  }

  async function updateCustomer() {
    try {
      const id = document.getElementById("updateId").value;
      const body = {
        name: document.getElementById("updateName").value,
        email: document.getElementById("updateEmail").value,
        address: document.getElementById("updateAddress").value,
        mobile: document.getElementById("updateMobile").value,
        unit_consumed: parseInt(document.getElementById("updateUnits").value)
      };

      const res = await fetch(`${baseUrl}/${id}`, {
        method: "PUT",
        headers: {
          "Content-Type": "application/json",
          Authorization: "Bearer " + localStorage.getItem("token")
        },
        body: JSON.stringify(body)
      });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (!res.ok) throw new Error("Update failed");

      const data = await res.json();

      document.getElementById("updateOutput").textContent =
        `✏️ Customer with ID ${data.id} updated to "${data.name}"`;
      getAllCustomers();

    } catch (err) {
      console.error("Update error:", err);
      document.getElementById("updateOutput").textContent = "❌ " + err.message;
    }
  }

  async function deleteCustomer() {
    try {
      const id = document.getElementById("deleteId").value;
      const res = await fetch(`${baseUrl}/${id}`, {
        method: "DELETE",
        headers: { Authorization: "Bearer " + localStorage.getItem("token") }
      });

      if (res.status === 401) {
        handleUnauthorized();
        return;
      }
      if (res.status === 204) {
        document.getElementById("deleteOutput").textContent =
          `🗑️ Customer with ID ${id} deleted.`;
        getAllCustomers();
      } else {
        document.getElementById("deleteOutput").textContent =
          `❌ Customer with ID ${id} not found.`;
      }

    } catch (err) {
      console.error("Delete error:", err);
      document.getElementById("deleteOutput").textContent = "❌ " + err.message;
    }
  }
</script>

</body>
</html>
