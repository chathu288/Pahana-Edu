<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Item Management</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <style>
    body { padding: 30px; background-color: #f8f9fa; }
    h2 { color: #0d6efd; }
    .section { margin-bottom: 30px; }
  </style>
</head>
<body>

<div class="container">
  <h2>📦 Item Management Portal</h2>

  <!-- Get All Items -->
  <div class="section">
    <button class="btn btn-primary" onclick="getAllItems()">Get All Items</button>
    <table class="table table-bordered table-striped mt-3" id="itemsTable" style="display: none;">
      <thead class="table-dark">
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Price</th>
          <th>Quantity</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <!-- Get Item by ID -->
  <div class="section">
    <h5>🔍 Get Item by ID</h5>
    <div class="input-group mb-2 w-50">
      <input type="number" class="form-control" id="getId" placeholder="Enter item ID" />
      <button class="btn btn-info" onclick="getItemById()">Get</button>
    </div>
    <div id="itemCard" class="card w-50" style="display:none;">
      <div class="card-body">
        <h5 class="card-title" id="itemName"></h5>
        <p><strong>ID:</strong> <span id="itemId"></span></p>
        <p><strong>Price:</strong> $<span id="itemPrice"></span></p>
        <p><strong>Quantity:</strong> <span id="itemQuantity"></span></p>
      </div>
    </div>
    <div id="itemError" class="text-danger mt-2"></div>
  </div>

  <!-- Create Item -->
  <div class="section">
    <h5>➕ Create Item</h5>
    <div class="row g-2 w-50">
      <div class="col-md-6">
        <input type="text" class="form-control" id="createName" placeholder="Enter item name" />
      </div>
      <div class="col-md-3">
        <input type="number" step="0.01" class="form-control" id="createPrice" placeholder="Enter price" />
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" id="createQuantity" placeholder="Enter quantity" />
      </div>
    </div>
    <button class="btn btn-success mt-2" onclick="createItem()">Create</button>
    <div id="createOutput" class="mt-2 text-success fw-bold"></div>
  </div>

  <!-- Update Item -->
  <div class="section">
    <h5>✏️ Update Item</h5>
    <div class="row g-2 w-75">
      <div class="col-md-3">
        <input type="number" class="form-control" id="updateId" placeholder="ID" />
      </div>
      <div class="col-md-3">
        <input type="text" class="form-control" id="updateName" placeholder="New Name" />
      </div>
      <div class="col-md-3">
        <input type="number" step="0.01" class="form-control" id="updatePrice" placeholder="New Price" />
      </div>
      <div class="col-md-3">
        <input type="number" class="form-control" id="updateQuantity" placeholder="New Quantity" />
      </div>
    </div>
    <button class="btn btn-warning mt-2 w-100" onclick="updateItem()">Update</button>
    <div id="updateOutput" class="mt-2 text-warning fw-bold"></div>
  </div>

  <!-- Delete Item -->
  <div class="section">
    <h5>❌ Delete Item</h5>
    <div class="input-group mb-2 w-50">
      <input type="number" class="form-control" id="deleteId" placeholder="Enter ID to delete" />
      <button class="btn btn-danger" onclick="deleteItem()">Delete</button>
    </div>
    <div id="deleteOutput" class="mt-2 text-danger fw-bold"></div>
  </div>
</div>

<script>
  // Change this URL to your actual backend URL for items
  const baseUrl = 'http://localhost:8080/pahanaedu-service/items';

  function getAllItems() {
    fetch(baseUrl)
      .then(res => res.json())
      .then(data => {
        const table = document.getElementById("itemsTable");
        const tbody = table.querySelector("tbody");
        tbody.innerHTML = '';
        data.forEach(item => {
          const row = `<tr>
            <td>${item.id}</td>
            <td>${item.name}</td>
            <td>$${item.price.toFixed(2)}</td>
            <td>${item.quantity}</td>
          </tr>`;
          tbody.insertAdjacentHTML("beforeend", row);
        });
        table.style.display = data.length ? "table" : "none";
      })
      .catch(err => console.error("Error fetching items:", err));
  }

  function getItemById() {
    const id = document.getElementById("getId").value;
    fetch(`${baseUrl}/${id}`)
      .then(res => {
        if (!res.ok) throw new Error("Item not found");
        return res.json();
      })
      .then(data => {
        document.getElementById("itemCard").style.display = "block";
        document.getElementById("itemId").textContent = data.id;
        document.getElementById("itemName").textContent = data.name;
        document.getElementById("itemPrice").textContent = data.price.toFixed(2);
        document.getElementById("itemQuantity").textContent = data.quantity;
        document.getElementById("itemError").textContent = "";
      })
      .catch(err => {
        document.getElementById("itemCard").style.display = "none";
        document.getElementById("itemError").textContent = err.message;
      });
  }

  function createItem() {
    const name = document.getElementById("createName").value;
    const price = parseFloat(document.getElementById("createPrice").value);
    const quantity = parseInt(document.getElementById("createQuantity").value);

    fetch(baseUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, price, quantity }),
    })
      .then(res => res.json())
      .then(data => {
        document.getElementById("createOutput").textContent =
          `✅ Item "${data.name}" created with ID ${data.id}`;
        getAllItems();
      })
      .catch(err => {
        document.getElementById("createOutput").textContent = "❌ Failed to create item";
        console.error("Create item error:", err);
      });
  }

  function updateItem() {
    const id = parseInt(document.getElementById("updateId").value);
    const name = document.getElementById("updateName").value;
    const price = parseFloat(document.getElementById("updatePrice").value);
    const quantity = parseInt(document.getElementById("updateQuantity").value);

    fetch(`${baseUrl}/${id}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, price, quantity }),
    })
      .then(res => {
        if (!res.ok) throw new Error("Update failed");
        return res.json();
      })
      .then(data => {
        document.getElementById("updateOutput").textContent =
          `✏️ Item with ID ${data.id} updated to "${data.name}"`;
        getAllItems();
      })
      .catch(err => {
        document.getElementById("updateOutput").textContent = err.message;
      });
  }

  function deleteItem() {
    const id = parseInt(document.getElementById("deleteId").value);

    fetch(`${baseUrl}/${id}`, {
      method: "DELETE",
    })
      .then(res => {
        if (res.status === 204) {
          document.getElementById("deleteOutput").textContent =
            `🗑️ Item with ID ${id} deleted.`;
          getAllItems();
        } else {
          document.getElementById("deleteOutput").textContent =
            `❌ Item with ID ${id} not found.`;
        }
      })
      .catch(err => {
        document.getElementById("deleteOutput").textContent = "❌ Failed to delete item";
        console.error("Delete item error:", err);
      });
  }
</script>

</body>
</html>
