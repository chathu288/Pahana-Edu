<!DOCTYPE html>
<html lang="en" data-layout="">

<head>
    <meta charset="utf-8" />
    <title>LOG IN | PAHANA EDU</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description" />
    <meta content="Coderthemes" name="author" />

    <!-- App favicon -->
    <link rel="shortcut icon" href="assets/images/225618255.png">

    <!-- Theme Config Js -->
    <script src="assets/js/config.js"></script>

    <!-- Vendor css -->
    <link href="assets/css/vendor.min.css" rel="stylesheet" type="text/css" />

    <!-- App css -->
    <link href="assets/css/app.min.css" rel="stylesheet" type="text/css" id="app-style" />

    <!-- Icons css -->
    <link href="assets/css/icons.min.css" rel="stylesheet" type="text/css" />
</head>

<body>

    <div class="auth-bg d-flex min-vh-100">
        <div class="row g-0 justify-content-center w-100 m-xxl-5 px-xxl-4 m-3">
            <div class="col-xxl-3 col-lg-5 col-md-6">
       

                

                <div class="card overflow-hidden text-center p-xxl-4 p-3 mb-0">
         <a href="#" class="auth-brand d-flex justify-content-center mb-2">
                    <img src="assets/images/225618255.png" alt="dark logo" height="100" class="logo-dark">
                    <img src="assets/images/225618255.png" alt="logo light" height="100" class="logo-light">
                </a>
                    <h4 class="fw-semibold mb-3 fs-18">Log in to your account</h4>

                 
                   <form id="loginForm" class="text-start mb-3">
    <div class="mb-3">
        <label class="form-label" for="example-email">Username</label>
        <input type="text" id="example-email" name="username" class="form-control"
            placeholder="Enter your username" required>
    </div>

    <div class="mb-3">
        <label class="form-label" for="example-password">Password</label>
        <input type="password" id="example-password" name="password" class="form-control"
            placeholder="Enter your password" required>
    </div>

    <div class="d-grid">
        <button class="btn btn-primary fw-semibold" type="submit">Login</button>
    </div>
</form>
    
                </div>
                <p class="mt-4 text-center mb-0 " style="color:white">
                    <script>document.write(new Date().getFullYear())</script> © Pahana Edu - By <span
                        class="fw-bold text-decoration-underline text-uppercase text-reset fs-12">Chathuranga</span>
                </p>
            </div>
        </div>
    </div>

    <!-- Vendor js -->
    <script src="assets/js/vendor.min.js"></script>

    <!-- App js -->
    <script src="assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
document.getElementById("loginForm").addEventListener("submit", async function (e) {
    e.preventDefault(); // stop default form action

    const username = document.getElementById("example-email").value;
    const password = document.getElementById("example-password").value;

    try {
        const response = await fetch("http://localhost:8080/pahanaedu-service/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if (response.ok) {
            const data = await response.json();
            localStorage.setItem("token", data.token); // save token

            Swal.fire({
                icon: 'success',
                title: 'Login Successful',
                text: 'Redirecting...',
                timer: 1500,
                showConfirmButton: false
            }).then(() => {
                window.location.href = "create_invoice.html"; // redirect on success
            });
        } else {
            Swal.fire({
                icon: 'error',
                title: 'Login Failed',
                text: 'Invalid credentials. Please try again.'
            });
        }
    } catch (error) {
        console.error("Login failed:", error);
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: 'Login error. Please try again later.'
        });
    }
});
</script>
</body>

</html>
